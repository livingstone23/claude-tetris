<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">THEME</span>
          <div class="theme-toggle">
            <span class="toggle-icon">🌙</span>
            <label class="switch">
              <input type="checkbox" id="theme-toggle" />
              <span class="slider"></span>
            </label>
            <span class="toggle-icon">☀️</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">RECORDS</span>
          <div id="panel-records" class="panel-records"></div>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title" data-mode="start">TETRIS</p>

        <div id="overlay-stats" class="hidden">
          <p id="overlay-score"></p>
          <p id="overlay-extra"></p>
        </div>

        <div id="record-entry" class="hidden">
          <p class="new-record-label">¡NUEVO RECORD!</p>
          <div class="name-input-row">
            <input type="text" id="player-name" maxlength="12" placeholder="Tu nombre"
                   autocomplete="off" spellcheck="false" />
            <button id="save-record-btn">OK</button>
          </div>
        </div>

        <div id="overlay-records"></div>

        <div class="overlay-buttons">
          <button id="restart-btn">JUGAR</button>
          <button id="reset-records-btn" class="btn-secondary">Borrar records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
