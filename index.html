<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">THEME</span>
          <div class="theme-toggle">
            <span class="toggle-icon">🌙</span>
            <label class="switch">
              <input type="checkbox" id="theme-toggle" />
              <span class="slider"></span>
            </label>
            <span class="toggle-icon">☀️</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div id="gameover-box" class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>

      <div id="pause-box" class="overlay-box pause-menu hidden">
        <p class="menu-title">PAUSA</p>
        <nav class="menu-nav">
          <button id="resume-btn">Reanudar</button>
          <button id="restart-pause-btn">Reiniciar</button>
          <button id="controls-toggle-btn">Ver controles</button>
        </nav>
        <ul id="pause-controls-list" class="pause-controls hidden">
          <li><kbd>←</kbd> <kbd>→</kbd> Mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> Rotar</li>
          <li><kbd>↓</kbd> Bajar lento</li>
          <li><kbd>Space</kbd> Caída rápida</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> Pausa</li>
        </ul>
        <div class="level-selector">
          <span class="selector-label">NIVEL INICIAL</span>
          <div class="level-row">
            <button id="level-dec" class="lvl-btn">−</button>
            <span id="start-level-val">1</span>
            <button id="level-inc" class="lvl-btn">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
